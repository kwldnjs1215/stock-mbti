<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>유형 도감 (내부용)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --ink: #1d1a16; --muted: #6e6250; --paper: #fbf4e2; --red: #b8322a; --blue: #2f4a7a; --ok: #2a8a5a; --rule: #e0d2b2; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Pretendard Variable", Pretendard, sans-serif; background: #f1e6cc; color: var(--ink); }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    h2 { font-size: 18px; margin: 28px 0 10px; }
    .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
    .panel { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 16px; }
    .checks li { margin: 4px 0; font-size: 14px; }
    .ok { color: var(--ok); font-weight: 800; }
    .bad { color: var(--red); font-weight: 800; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
    th, td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: var(--paper); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
    .card { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; }
    .card-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 2px solid var(--ink); }
    .card-head .ant { width: 84px; height: 84px; flex: none; border-radius: 50%; }
    .code { font-size: 12px; font-weight: 900; letter-spacing: 0.15em; color: var(--muted); }
    .name { font-size: 20px; font-weight: 800; margin: 2px 0; }
    .quote { font-size: 13px; color: var(--red); font-weight: 700; }
    .card-body { padding: 10px 12px 12px; font-size: 13px; line-height: 1.6; }
    .card-body h4 { margin: 10px 0 2px; font-size: 12px; color: var(--muted); }
    .card-body ul { margin: 0; padding-left: 16px; }
    .card-body p { margin: 0; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
    .pair div { border-radius: 8px; padding: 6px 8px; font-size: 12px; }
    .pair .g { background: #f6dcd3; } .pair .b { background: #dbe3ef; }
    .pair b { display: block; font-size: 13px; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--ink); color: #fff; margin-left: 4px; }
  </style>
</head>
<body>
<main>
  <h1>동학개미 MBTI · 유형 도감</h1>
  <p class="sub">내부 확인용 페이지예요. public 폴더 밖에 있어서 배포되지 않아요. 데이터는 public/data.js를 그대로 읽어요.</p>

  <h2>자동 검증</h2>
  <div class="panel"><ul class="checks" id="checks"></ul></div>

  <h2>유형 분포 (2<sup>20</sup>가지 응답 조합 전부 계산)</h2>
  <div id="dist"></div>

  <h2>궁합 표</h2>
  <div id="pairs"></div>

  <h2>문항 (A = 축의 앞 글자)</h2>
  <div id="questions"></div>

  <h2>16가지 유형 전체</h2>
  <div class="grid" id="grid"></div>
</main>

<script src="../public/data.js"></script>
<script src="../public/characters.js"></script>
<script>
  const codes = Object.keys(TYPES);
  const name = (c) => TYPES[c].name;
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const checks = [];
  const check = (okay, text) => checks.push(`<li><span class="${okay ? "ok" : "bad"}">${okay ? "통과" : "확인 필요"}</span> ${text}</li>`);

  // 1) 문항 구성: 축마다 홀수 개여야 동점이 없다
  const per = [0, 0, 0, 0];
  QUESTIONS.forEach((q) => per[q.axis]++);
  check(per.every((n) => n % 2 === 1), `축별 문항 수 ${per.join(" / ")} (홀수라 동점 없음)`);

  // 2) 모든 응답 조합을 app.js와 같은 규칙(축별 과반)으로 판정
  const counts = Object.fromEntries(codes.map((c) => [c, 0]));
  const N = QUESTIONS.length;
  for (let m = 0; m < 1 << N; m++) {
    const a = [0, 0, 0, 0];
    for (let i = 0; i < N; i++) if (m & (1 << i)) a[QUESTIONS[i].axis]++;
    counts[AXES.map((ax, k) => (a[k] * 2 > per[k] ? ax.a : ax.b)).join("")]++;
  }
  const reached = codes.filter((c) => counts[c] > 0);
  check(reached.length === 16, `나올 수 있는 유형 ${reached.length} / 16`);
  const pcts = codes.map((c) => counts[c] / (1 << N));
  check(Math.max(...pcts) - Math.min(...pcts) < 1e-9, "무작위로 답하면 16유형이 모두 같은 확률(6.25%)");
  document.getElementById("dist").innerHTML = `<table><tr><th>유형</th><th>코드</th><th>조합 수</th><th>비율</th></tr>${codes
    .map((c) => `<tr><td>${name(c)}</td><td>${c}</td><td>${counts[c].toLocaleString()}</td><td>${(counts[c] / (1 << N) * 100).toFixed(2)}%</td></tr>`)
    .join("")}</table>`;

  // 3) 궁합 검사
  const problems = [];
  const asBest = {}, asWorst = {};
  for (const c of codes) {
    const t = TYPES[c];
    if (!TYPES[t.best] || !TYPES[t.worst]) problems.push(`${name(c)}: 궁합 대상이 없는 코드`);
    if (t.best === c || t.worst === c) problems.push(`${name(c)}: 자기 자신과 궁합`);
    if (t.best === t.worst) problems.push(`${name(c)}: 찰떡과 최악이 같음`);
    if (TYPES[t.best]?.worst === c) problems.push(`${name(c)} → 찰떡 ${name(t.best)}, 그런데 ${name(t.best)} → 최악 ${name(c)}`);
    asBest[t.best] = (asBest[t.best] || 0) + 1;
    asWorst[t.worst] = (asWorst[t.worst] || 0) + 1;
  }
  check(problems.length === 0, problems.length ? `궁합 모순: ${problems.map(esc).join(" / ")}` : "궁합 모순 없음 (A의 찰떡이 B인데 B의 최악이 A인 경우 없음)");
  const oneWayBest = codes.filter((c) => TYPES[TYPES[c].best].best !== c);
  check(oneWayBest.length === 0, oneWayBest.length ? `찰떡이 한쪽으로만 향함: ${oneWayBest.map((c) => `${name(c)}→${name(TYPES[c].best)}`).join(", ")}` : "찰떡 궁합이 모두 서로를 가리킴");
  const oneWayWorst = codes.filter((c) => TYPES[TYPES[c].worst].worst !== c);
  check(oneWayWorst.length === 0, oneWayWorst.length ? `최악이 한쪽으로만 향함: ${oneWayWorst.map((c) => `${name(c)}→${name(TYPES[c].worst)}`).join(", ")}` : "최악 궁합이 모두 서로를 가리킴");
  const neverBest = codes.filter((c) => !asBest[c]);
  const neverWorst = codes.filter((c) => !asWorst[c]);
  check(neverBest.length === 0, neverBest.length ? `누구의 찰떡으로도 안 나오는 유형: ${neverBest.map(name).join(", ")}` : "모든 유형이 누군가의 찰떡으로 나옴");
  check(neverWorst.length === 0, neverWorst.length ? `누구의 최악으로도 안 나오는 유형: ${neverWorst.map(name).join(", ")}` : "모든 유형이 누군가의 최악으로 나옴");

  const noReasons = codes.flatMap((c) => [TYPES[c].best, TYPES[c].worst].filter((o) => matchReasons(c, o).length === 0).map((o) => `${name(c)}–${name(o)}`));
  check(noReasons.length === 0, noReasons.length ? `궁합 이유가 없는 짝: ${noReasons.join(", ")}` : "모든 궁합 짝에 맞춤 이유가 있음");

  document.getElementById("checks").innerHTML = checks.join("");

  document.getElementById("pairs").innerHTML = `<table><tr><th>유형</th><th>찰떡 궁합</th><th>상대도 나를 찰떡?</th><th>최악 궁합</th><th>상대도 나를 최악?</th><th>찰떡으로 뽑힌 횟수</th><th>최악으로 뽑힌 횟수</th></tr>${codes
    .map((c) => {
      const t = TYPES[c];
      const mb = TYPES[t.best].best === c, mw = TYPES[t.worst].worst === c;
      return `<tr><td>${name(c)}</td><td>${name(t.best)}</td><td class="${mb ? "ok" : ""}">${mb ? "예" : "아니오"}</td><td>${name(t.worst)}</td><td class="${mw ? "ok" : ""}">${mw ? "예" : "아니오"}</td><td>${asBest[c] || 0}</td><td>${asWorst[c] || 0}</td></tr>`;
    })
    .join("")}</table>`;

  document.getElementById("questions").innerHTML = `<table><tr><th>#</th><th>축</th><th>질문</th><th>A</th><th>B</th></tr>${QUESTIONS.map((q, i) => {
    const ax = AXES[q.axis];
    return `<tr><td>Q${i + 1}</td><td>${ax.aName} / ${ax.bName}</td><td>${esc(q.q)}</td><td><b>${ax.a}</b> ${esc(q.A)}</td><td><b>${ax.b}</b> ${esc(q.B)}</td></tr>`;
  }).join("")}</table>`;

  const li = (arr) => `<ul>${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  document.getElementById("grid").innerHTML = codes
    .map((c) => {
      const t = TYPES[c];
      return `<article class="card">
        <div class="card-head">
          <div style="background:${ANTS[c].color};border-radius:50%">${antSVG(c)}</div>
          <div>
            <div class="code">${c} · ?t=${SLUGS[c]}</div>
            <div class="name">${esc(t.name)}</div>
            <div class="quote">“${esc(t.quote)}”</div>
          </div>
        </div>
        <div class="card-body">
          <p>${esc(t.desc)}</p>
          <h4>투자 스타일 · ${esc(t.style)}</h4>${li(t.styleDesc)}
          <h4>매매 습관</h4>${li(t.trade)}
          <h4>투자 멘탈</h4>${li(t.mental)}
          <h4>계좌 특징</h4>${li(t.account)}
          <h4>강점</h4><p>${esc(t.strength)}</p>
          <h4>주의할 점</h4><p>${esc(t.caution)}</p>
          <h4>이렇게 해 보세요</h4><p>${esc(t.tip)}</p>
          <div class="pair">
            <div class="g">▲ 찰떡<b>${esc(name(t.best))}<span class="tag">${t.best}</span></b>${esc(t.bestScene)}${li(matchReasons(c, t.best))}</div>
            <div class="b">▼ 최악<b>${esc(name(t.worst))}<span class="tag">${t.worst}</span></b>${esc(t.worstScene)}${li(matchReasons(c, t.worst))}</div>
          </div>
        </div>
      </article>`;
    })
    .join("");
</script>
</body>
</html>
